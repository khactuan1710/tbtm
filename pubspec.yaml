name: quanlymaygiat
description: "Quản lý máy giặt — cross-platform Flutter app (Cubit + Freezed + Retrofit + AutoRoute)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0

  # JSON / mapping
  json_annotation: ^4.12.0

  # Network
  dio: ^5.7.0
  retrofit: ^4.4.1

  # Local storage
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.3.2

  # Routing
  auto_route: ^11.1.0

  # DI
  get_it: ^9.2.0
  injectable: ^2.5.0

  # Functional error handling
  dartz: ^0.10.1

  # Utils
  logger: ^2.5.0
  intl: ^0.20.2
  gap: ^3.0.1
  url_launcher: ^6.3.2
  webview_flutter: ^4.10.0
  connectivity_plus: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen
  build_runner: ^2.11.1
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2
  auto_route_generator: ^10.4.0
  retrofit_generator: ^10.2.1
  freezed: ^3.2.3

flutter:
  uses-material-design: true
